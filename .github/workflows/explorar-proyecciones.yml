# Temporal: explora las fuentes de proyecciones (FMI y páginas públicas del Banco Central, sin
# credenciales). Se borra antes del merge.
name: Explorar proyecciones

on:
  workflow_dispatch:
  push:
    branches: [claude/epic-fermi-sipcg0]
    paths:
      - python/explorar_proyecciones.py
      - .github/workflows/explorar-proyecciones.yml

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python python/explorar_proyecciones.py
