# Sincronización de datos: descarga las series del Banco Central (y el Excel de IED por país, las
# proyecciones del IPoM y del FMI, los mercados de EE.UU. y el informe de la DIPRES) y, si cambiaron,
# hace commit de los JSON de public/data en main. Ese commit dispara la publicación en Vercel
# (producción). Corre todos los días, al hacer merge a main y a mano desde la pestaña Actions.
name: Data Sync

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar series del Banco Central
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASSWORD: ${{ secrets.BCCH_PASSWORD }}
        run: python python/sync_bcch_data.py

      # Excel público del Banco Central (sin credenciales). Si falla, se conserva el JSON anterior
      # y la sincronización del resto de las series sigue igual.
      - name: Descargar IED por país (Excel del Banco Central)
        continue-on-error: true
        run: python python/import_ied_paises.py

      # Proyecciones de crecimiento: Excel del IPoM (Banco Central) y API del FMI, ambos públicos.
      # Igual que la IED: si falla, se conserva el JSON anterior.
      - name: Descargar proyecciones (IPoM y FMI)
        continue-on-error: true
        run: python python/import_proyecciones.py

      # Tasas y mercados de EE.UU.: Tesoro, Fed de Nueva York y FRED (públicos). Si una fuente falla,
      # se conserva su versión anterior.
      - name: Descargar mercados de EE.UU.
        continue-on-error: true
        run: python python/import_mercados_eeuu.py

      # Finanzas públicas: el informe de ejecución presupuestaria más reciente de la DIPRES (público).
      # La DIPRES publica cada trimestre; mientras no haya uno nuevo, los datos quedan iguales.
      - name: Descargar finanzas públicas (DIPRES)
        continue-on-error: true
        run: python python/import_dipres.py

      - name: Commit de los datos (si cambiaron)
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add public/data/bcch_series.json public/data/ied_paises.json public/data/proyecciones.json public/data/finanzas_publicas.json public/data/mercados_eeuu.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "data: daily update"
            git pull --rebase origin main
            git push
          fi
