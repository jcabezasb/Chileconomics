# Temporal: corre el importador de IED por país con el Excel real (público, sin credenciales)
# y muestra el JSON generado. Se borra antes del merge.
name: Inspeccionar Excel IED

on:
  workflow_dispatch:
  push:
    branches: [claude/epic-fermi-sipcg0]
    paths:
      - python/import_ied_paises.py
      - .github/workflows/inspeccionar-ied.yml

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python python/import_ied_paises.py
      - run: echo "JSON_INICIO" && cat public/data/ied_paises.json && echo && echo "JSON_FIN"
