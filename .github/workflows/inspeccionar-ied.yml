# Temporal: genera public/data/ied_paises.json con el importador (Excel público, sin credenciales)
# y lo guarda en esta rama para poder revisar la vista previa. Se borra antes del merge.
name: Inspeccionar Excel IED

on:
  workflow_dispatch:
  push:
    branches: [claude/epic-fermi-sipcg0]
    paths:
      - python/import_ied_paises.py
      - .github/workflows/inspeccionar-ied.yml

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python python/import_ied_paises.py
      - name: Guardar el JSON en la rama
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add public/data/ied_paises.json
          git diff --staged --quiet || git commit -m "data: IED por país (generado por import_ied_paises.py)"
          git push
